apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ltm-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ltm-workers
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-workers
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ltm-integration-gateway
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-integration-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ltm-client-integration-broker
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-client-integration-broker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ltm-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ltm-api
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ltm-workers
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ltm-workers
  minReplicas: 2
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ltm-integration-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ltm-integration-gateway
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ltm-client-integration-broker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ltm-client-integration-broker
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
