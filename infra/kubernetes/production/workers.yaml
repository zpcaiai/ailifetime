apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltm-workers
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ltm-workers
        ltm.openai.com/network-role: workers
      annotations:
        ltm.openai.com/external-command-batches: "18"
        ltm.openai.com/external-callback-route-contracts: "19"
    spec:
      serviceAccountName: ltm-workers
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ltm-workers
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ltm-workers
      containers:
        - name: workers
          image: __LTM_WORKERS_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: ltm-production-config
            - secretRef:
                name: ltm-production-workers
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ltm-production-database
                  key: runtime-url
            - name: LTM_WORKER_MODE
              value: external
            - name: LTM_WORKER_TENANT_ID
              value: "__LTM_TENANT_ID__"
            - name: LTM_WORKER_HEALTH_PORT
              value: "8090"
            - name: LTM_CONSENT_POLICY_TRUST_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: ltm-production-consent-policy
                  key: trust-keys.json
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/ltm-workload/token
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: health
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: consent-policy
              mountPath: /var/run/secrets/ltm-consent-policy/catalog.json
              subPath: catalog.json
              readOnly: true
            - name: workload-token
              mountPath: /var/run/secrets/ltm-workload
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: consent-policy
          secret:
            secretName: ltm-production-consent-policy
            defaultMode: 0440
            items:
              - key: catalog.json
                path: catalog.json
        - name: workload-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  audience: ltm-production-secrets
                  expirationSeconds: 3600
