apiVersion: apps/v1
kind: Deployment
metadata:
  name: ltm-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ltm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ltm-api
        ltm.openai.com/network-role: api
    spec:
      serviceAccountName: ltm-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ltm-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ltm-api
      containers:
        - name: api
          image: __LTM_API_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ltm-production-config
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/ltm-client-broker-ca/ca.crt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ltm-production-database
                  key: runtime-url
            - name: LTM_METRICS_TOKEN_SHA256
              valueFrom:
                secretKeyRef:
                  name: ltm-production-api
                  key: metrics-token-sha256
            - name: LTM_EVIDENCE_TRUST_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: ltm-production-api
                  key: evidence-trust-keys-json
            - name: LTM_CONSENT_POLICY_TRUST_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: ltm-production-consent-policy
                  key: trust-keys.json
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 3
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: client-broker-tokens
              mountPath: /var/run/secrets/ltm-client-brokers
              readOnly: true
            - name: client-broker-ca
              mountPath: /var/run/secrets/ltm-client-broker-ca
              readOnly: true
            - name: consent-policy
              mountPath: /var/run/secrets/ltm-consent-policy
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: client-broker-tokens
          secret:
            secretName: ltm-production-client-brokers
            defaultMode: 0440
            items:
              - key: wechat-identity-token
                path: wechat-identity-token
              - key: upload-broker-token
                path: upload-broker-token
        - name: consent-policy
          secret:
            secretName: ltm-production-consent-policy
            defaultMode: 0440
            items:
              - key: catalog.json
                path: catalog.json
        - name: client-broker-ca
          secret:
            secretName: ltm-production-client-integration-broker-tls
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: ltm-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ltm-api
  ports:
    - name: http
      port: 8080
      targetPort: http
