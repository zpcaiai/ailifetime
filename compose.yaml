services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: "8080"
      LTM_AUTH_MODE: local-synthetic-only
      LTM_DEPLOYMENT_PROFILE: single-node
      LTM_DATABASE_PATH: /workspace/.data/ltm-compose.sqlite
      LTM_STATIC_DIR: /workspace/apps/web/public
      LTM_ALLOW_LEGACY_CONSENT_POLICY: "true"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - application-data:/workspace/.data

  workflow-worker:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    environment:
      APP_ENV: development
      LTM_DEPLOYMENT_PROFILE: single-node
      LTM_DATABASE_PATH: /workspace/.data/ltm-compose.sqlite
      LTM_WORKER_TENANT_ID: tenant-local
      LTM_WORKER_ACTOR_ID: ltm-local-workflow-worker
      LTM_WORKER_ID: ltm-local-workflow-worker
      LTM_WORKER_HEALTH_HOST: 0.0.0.0
      LTM_WORKER_HEALTH_PORT: "8090"
    ports: ["8090:8090"]
    depends_on:
      api:
        condition: service_healthy
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - application-data:/workspace/.data

  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_USER: ltm
      POSTGRES_PASSWORD: ltm_local
      POSTGRES_DB: ltm
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltm -d ltm"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - object-data:/data

volumes:
  application-data:
  postgres-data:
  redis-data:
  object-data:
