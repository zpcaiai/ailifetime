services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ltm
      POSTGRES_PASSWORD: ltm_local
      POSTGRES_DB: ltm
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  object-storage:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: local-development-only
    ports: ["9000:9000", "9001:9001"]
