version: '1.0'
rules:
- Every flag has owner, rationale, default, target environments, expiry date, rollback
  action, and audit trail.
- Safety, consent, AI labels, tenant isolation, child controls, payment integrity,
  and deletion cannot be disabled by an experiment flag.
- Flags affecting contracts or data writes require compatibility for both states.
