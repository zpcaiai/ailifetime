version: '1.0'
format:
  code: DOMAIN_REASON
  http_status: integer
  retryable: boolean
  user_safe: localized message key
  operator_action: runbook key
errors:
- code: AUTH_UNAUTHENTICATED
  http_status: 401
  retryable: false
  user_safe: auth.sign_in_required
- code: AUTH_FORBIDDEN
  http_status: 403
  retryable: false
  user_safe: auth.not_allowed
- code: TENANT_SCOPE_MISMATCH
  http_status: 403
  retryable: false
  user_safe: auth.not_allowed
- code: CONSENT_REQUIRED
  http_status: 409
  retryable: false
  user_safe: consent.required
- code: CONSENT_WITHDRAWN
  http_status: 409
  retryable: false
  user_safe: consent.withdrawn
- code: GUARDIAN_VERIFICATION_REQUIRED
  http_status: 409
  retryable: false
  user_safe: guardian.verification_required
- code: MEDIA_UNSUPPORTED
  http_status: 422
  retryable: false
  user_safe: media.unsupported
- code: MEDIA_QUALITY_TOO_LOW
  http_status: 422
  retryable: false
  user_safe: media.retake
- code: CONTENT_POLICY_BLOCKED
  http_status: 422
  retryable: false
  user_safe: safety.cannot_process
- code: PUBLIC_FIGURE_REVIEW_REQUIRED
  http_status: 409
  retryable: false
  user_safe: safety.authorization_review
- code: JOB_DUPLICATE_REQUEST
  http_status: 409
  retryable: false
  user_safe: job.duplicate
- code: JOB_TRANSIENT_PROVIDER
  http_status: 503
  retryable: true
  user_safe: job.trying_again
- code: JOB_QUALITY_GATE_FAILED
  http_status: 422
  retryable: true
  user_safe: job.quality_retry
- code: JOB_CANCELLED
  http_status: 409
  retryable: false
  user_safe: job.cancelled
- code: QUOTA_EXCEEDED
  http_status: 429
  retryable: true
  user_safe: quota.wait_or_upgrade
- code: PRICE_QUOTE_EXPIRED
  http_status: 409
  retryable: false
  user_safe: checkout.refresh_price
- code: PAYMENT_PENDING
  http_status: 202
  retryable: true
  user_safe: payment.pending
- code: PAYMENT_WEBHOOK_INVALID
  http_status: 400
  retryable: false
  user_safe: generic.invalid_request
- code: ORDER_STATE_CONFLICT
  http_status: 409
  retryable: false
  user_safe: order.refresh
- code: SHARE_REVOKED
  http_status: 410
  retryable: false
  user_safe: share.unavailable
- code: PARTNER_RATE_LIMITED
  http_status: 429
  retryable: true
  user_safe: partner.rate_limited
- code: POLICY_VERSION_UNKNOWN
  http_status: 503
  retryable: false
  user_safe: generic.temporarily_unavailable
- code: PRIVACY_DELETE_IN_PROGRESS
  http_status: 202
  retryable: true
  user_safe: privacy.in_progress
- code: FUTURE_SELF_CRISIS_HANDOFF
  http_status: 200
  retryable: false
  user_safe: future_self.safe_handoff
