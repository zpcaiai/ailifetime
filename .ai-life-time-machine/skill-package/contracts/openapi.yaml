openapi: 3.1.0
info:
  title: AI Life Time Machine API
  version: 1.0.0
  description: Reference contract. Adapt to the repository; do not expose an endpoint until authorization, consent, idempotency,
    audit, and retention are implemented.
servers:
- url: https://api.example.invalid
  description: Placeholder only; never deploy this hostname.
security:
- bearerAuth: []
tags:
- name: Guest
- name: Media
- name: Consent
- name: Projects
- name: Generation
- name: Sharing
- name: Commerce
- name: FutureSelf
- name: Privacy
- name: Partner
paths:
  /v1/guest-sessions:
    post:
      tags:
      - Guest
      security: []
      summary: Create a short-lived guest session
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/upload-sessions:
    post:
      tags:
      - Media
      summary: Create an isolated signed upload session
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/consents:
    post:
      tags:
      - Consent
      summary: Create purpose-specific participant authorization
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReceipt'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/projects:
    post:
      tags:
      - Projects
      summary: Create a versioned composition project
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/generation-jobs:
    post:
      tags:
      - Generation
      summary: Start an idempotent durable generation workflow
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerationJobRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/generation-jobs/{jobId}:
    get:
      tags:
      - Generation
      summary: Read generation state
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/generation-jobs/{jobId}/cancel:
    post:
      tags:
      - Generation
      summary: Request safe cancellation
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/shares:
    post:
      tags:
      - Sharing
      summary: Create a revocable labelled share
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Share'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/shares/{shareId}:
    delete:
      tags:
      - Sharing
      summary: Revoke a share and purge edge caches
      parameters:
      - name: shareId
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Revocation accepted
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Not found
  /v1/checkout-sessions:
    post:
      tags:
      - Commerce
      summary: Create a server-priced checkout
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/orders/{orderId}:
    get:
      tags:
      - Commerce
      summary: Read an authorized order
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/future-self/messages:
    post:
      tags:
      - FutureSelf
      summary: Send a message to the clearly disclosed fictional future-self agent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FutureSelfMessageRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FutureSelfMessage'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /v1/data-rights/requests:
    post:
      tags:
      - Privacy
      summary: Submit a verified data-subject request
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightsRequest'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RightsCase'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
  /partner/v1/customer-sessions:
    post:
      tags:
      - Partner
      security:
      - partnerOAuth:
        - jobs:write
      summary: Create a hosted, consent-first customer session
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCustomerSessionRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCustomerSession'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '409':
          description: Conflict
        '429':
          description: Rate limited
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    partnerOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            jobs:write: Create jobs
            jobs:read: Read jobs
            orders:write: Create orders
            privacy:write: Submit rights requests
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  schemas:
    ApiError:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
        retryable:
          type: boolean
    GuestSession:
      type: object
      required:
      - id
      - expires_at
      - consent_preflight_version
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        consent_preflight_version:
          type: string
    UploadSessionRequest:
      type: object
      required:
      - purpose
      - declared_participant_count
      - content_type
      - size_bytes
      properties:
        purpose:
          type: string
        declared_participant_count:
          type: integer
          minimum: 1
          maximum: 20
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    UploadSession:
      type: object
      required:
      - id
      - asset_id
      - upload_url
      - expires_at
      properties:
        id:
          type: string
        asset_id:
          type: string
        upload_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        required_headers:
          type: object
    ConsentRequest:
      type: object
      required:
      - participant_id
      - grantor_capacity
      - purpose
      - scope
      - policy_version
      - evidence
      properties:
        participant_id:
          type: string
        grantor_capacity:
          enum:
          - self
          - guardian
          - authorized-agent
        purpose:
          type: string
        scope:
          type: object
        policy_version:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        evidence:
          type: object
    ConsentReceipt:
      type: object
      required:
      - id
      - status
      - evidence_hash
      - granted_at
      properties:
        id:
          type: string
        status:
          enum:
          - active
          - pending-verification
        evidence_hash:
          type: string
        granted_at:
          type: string
          format: date-time
    ProjectRequest:
      type: object
      required:
      - template_id
      - participant_slots
      - timeline_ages
      - visibility
      properties:
        template_id:
          type: string
        participant_slots:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - participant_id
            - source_asset_ids
            - consent_refs
            properties:
              participant_id:
                type: string
              source_asset_ids:
                type: array
                minItems: 1
                items:
                  type: string
              consent_refs:
                type: array
                minItems: 1
                items:
                  type: string
        timeline_ages:
          type: array
          minItems: 1
          items:
            type: integer
            minimum: 0
            maximum: 120
        visibility:
          enum:
          - private
          - household
        options:
          type: object
    Project:
      type: object
      required:
      - id
      - state
      - version
      properties:
        id:
          type: string
        state:
          enum:
          - draft
          - ready
          - locked
          - archived
        version:
          type: integer
        policy_summary:
          type: object
    GenerationJobRequest:
      type: object
      required:
      - project_id
      - quote_id
      - entitlement_id
      properties:
        project_id:
          type: string
        quote_id:
          type: string
        entitlement_id:
          type: string
        client_request_id:
          type: string
    GenerationJob:
      type: object
      required:
      - id
      - state
      - created_at
      - progress
      properties:
        id:
          type: string
        state:
          enum:
          - queued
          - preflight
          - running
          - quality-review
          - ready
          - partial
          - failed
          - cancelled
          - expired
        progress:
          type: object
          properties:
            stage:
              type: string
            completed_units:
              type: integer
            total_units:
              type:
              - integer
              - 'null'
        result_manifest_url:
          type:
          - string
          - 'null'
          format: uri
        error:
          anyOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ShareRequest:
      type: object
      required:
      - artifact_ids
      - access
      - expires_at
      properties:
        artifact_ids:
          type: array
          minItems: 1
          items:
            type: string
        access:
          enum:
          - private-link
          - public
        expires_at:
          type: string
          format: date-time
        allow_download:
          type: boolean
        participant_consent_refs:
          type: array
          items:
            type: string
    Share:
      type: object
      required:
      - id
      - url
      - status
      - expires_at
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        status:
          enum:
          - active
          - revoked
          - expired
          - reported
        expires_at:
          type: string
          format: date-time
        provenance_id:
          type: string
    CheckoutRequest:
      type: object
      required:
      - items
      - currency
      - return_url
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - sku
            - quantity
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1
              project_id:
                type:
                - string
                - 'null'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        promotion_code:
          type:
          - string
          - 'null'
        return_url:
          type: string
          format: uri
    CheckoutSession:
      type: object
      required:
      - id
      - quote_id
      - amount_minor
      - currency
      - payment_url
      - expires_at
      properties:
        id:
          type: string
        quote_id:
          type: string
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
        payment_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    Order:
      type: object
      required:
      - id
      - state
      - items
      - amount_minor
      - currency
      properties:
        id:
          type: string
        state:
          enum:
          - awaiting-consent
          - paid
          - processing
          - partial
          - fulfilled
          - cancelled
          - refunded
          - disputed
        items:
          type: array
          items:
            type: object
        amount_minor:
          type: integer
        currency:
          type: string
        delivery_manifest_url:
          type:
          - string
          - 'null'
          format: uri
    FutureSelfMessageRequest:
      type: object
      required:
      - conversation_id
      - message
      - disclosure_ack
      properties:
        conversation_id:
          type: string
        message:
          type: string
          maxLength: 5000
        disclosure_ack:
          const: true
        memory_mode:
          enum:
          - 'off'
          - session
          - explicit
    FutureSelfMessage:
      type: object
      required:
      - message_id
      - role_disclosure
      - content
      - safety_state
      properties:
        message_id:
          type: string
        role_disclosure:
          type: string
        content:
          type: string
        safety_state:
          enum:
          - normal
          - dependency-warning
          - crisis-handoff
          - blocked
        resources:
          type: array
          items:
            type: object
    RightsRequest:
      type: object
      required:
      - type
      - scope
      - verification_method
      properties:
        type:
          enum:
          - access
          - export
          - correct
          - withdraw-consent
          - restrict
          - delete
          - appeal
        scope:
          type: object
        verification_method:
          type: string
        reason:
          type:
          - string
          - 'null'
    RightsCase:
      type: object
      required:
      - id
      - state
      - submitted_at
      - target_at
      properties:
        id:
          type: string
        state:
          enum:
          - verification
          - in-progress
          - waiting-downstream
          - completed
          - partially-completed
          - denied
          - appealed
        submitted_at:
          type: string
          format: date-time
        target_at:
          type: string
          format: date-time
        receipt_url:
          type:
          - string
          - 'null'
          format: uri
    PartnerCustomerSessionRequest:
      type: object
      required:
      - external_customer_ref
      - purpose
      - return_url
      properties:
        external_customer_ref:
          type: string
          maxLength: 256
        purpose:
          type: string
        return_url:
          type: string
          format: uri
        brand_context:
          type: object
    PartnerCustomerSession:
      type: object
      required:
      - id
      - hosted_url
      - expires_at
      properties:
        id:
          type: string
        hosted_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
