        - evidenceId
        - decisionState
        - reconciliationState
        - version
        - requestedAt
        - updatedAt
        - terminalAt
        - details
      properties:
        commandId:
          $ref: "#/components/schemas/Identifier"
        tenantId:
          $ref: "#/components/schemas/Identifier"
        batchId:
          $ref: "#/components/schemas/BatchId"
        operation:
          $ref: "#/components/schemas/Identifier"
        aggregateCollection:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{0,79}$'
        aggregateId:
          $ref: "#/components/schemas/Identifier"
        state:
          enum: [requested, dispatched, acknowledged, succeeded, failed, cancelled, compensated]
        providerOperationId:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        evidenceId:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        decisionState:
          enum: [active, frozen]
        reconciliationState:
          enum: [clear, reconciliation_required]
        version:
          type: integer
          minimum: 1
        requestedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        updatedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        terminalAt:
          oneOf:
            - $ref: "#/components/schemas/CanonicalTimestamp"
            - type: "null"
        details:
          type: object
    B05CapabilityInput:
