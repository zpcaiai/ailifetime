openapi: 3.1.0
info:
  title: AI Life Time Machine Runtime API
  version: 1.0.0
  description: Tenant-safe command, query, and B00-B127 capability dispatch API. The 18 external-command batches resolve to 19 fixed signed callback contracts because B10 has distinct publishExport and revokeExport operations.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Runtime and audit chain are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Runtime, audit chain, or evidence trust is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      operationId: getMetrics
      description: Aggregate low-cardinality Prometheus metrics. Production requires a separately configured bearer token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /v1/auth/browser/config:
    get:
      operationId: getBrowserOidcConfiguration
      description: Returns the closed, public Authorization Code + PKCE S256 configuration. It contains no client secret, token, trust key, or mutable provider discovery response.
      responses:
        "200":
          description: Deployment-pinned public SPA OIDC configuration.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserOidcConfiguration"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/wechat/session:
    post:
      operationId: exchangeWechatLoginCode
      description: Exchanges a single-use wx.login code through the configured HTTPS identity broker; roles and tenant are server-resolved.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatSessionRequest"
      responses:
        "200":
          description: Short-lived in-memory client session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/session/refresh:
    post:
      operationId: refreshClientSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Rotated short-lived session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/session/logout:
    post:
      operationId: revokeClientSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Session revocation accepted by the identity broker.
        default:
          $ref: "#/components/responses/Error"
  /v1/session:
    get:
      operationId: getAuthenticatedSession
      description: Returns only the server-verified principal projection. Bearer credentials are never reflected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Authenticated browser or API session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/consent-policy/authority:
    get:
      operationId: getConsentPolicyAuthority
      description: Returns only metadata from the server-verified signed consent-policy catalog. Production deployment probes authenticate with workload identity and bind this projection to the release subject.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Active production consent-policy catalog authority metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentPolicyAuthorityResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities/visible:
    get:
      operationId: listVisibleCapabilities
      description: Returns the intersection of the server portal manifest, verified roles, and executable permissions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Server-authorized capability and portal projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibleCapabilityCatalog"
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        "200":
          description: The exact B00-B127 executable catalog.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, count, requestId]
                properties:
                  capabilities:
                    type: array
                    minItems: 128
                    maxItems: 128
                    items:
                      $ref: "#/components/schemas/Capability"
                  count:
                    const: 128
                  requestId:
                    type: string
    post:
      operationId: executeCapabilityEnvelope
      description: For B05 the public input is the closed `{assetId, reason}` contract. Classification, retention and deletion targets are resolved only by the broker's signed production policy catalog; success includes the complete per-target receipt set.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, input]
              properties:
                batchId:
                  $ref: "#/components/schemas/BatchId"
                input:
                  type: object
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      operationId: createResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreateRequest"
      responses:
        "201":
          description: Durable upload session created by the media broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/chunks:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: appendResumableUploadChunk
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: Content-Range
          in: header
          required: true
          schema:
            type: string
            pattern: '^bytes (0|[1-9]\d*)-(0|[1-9]\d*)/(0|[1-9]\d*)$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: byte
              maxLength: 6990508
      responses:
        "200":
          description: Chunk durably accepted at the exact offset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nextOffset]
                properties:
                  nextOffset:
                    type: integer
                    minimum: 1
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: completeResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDigest"
      responses:
        "200":
          description: Media verified and available through its opaque reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedUpload"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/cancel:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: cancelResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Upload cancellation accepted.
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/BatchId"
    get:
      operationId: getCapability
      responses:
        "200":
          description: Registered capability metadata.
          content:
            application/json:
              schema:
                type: object
                required: [capability, requestId]
                properties:
                  capability:
                    $ref: "#/components/schemas/Capability"
                  requestId:
                    type: string
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: executeCapability
      description: For B05 the public input is the closed `{assetId, reason}` contract. Caller-supplied policy or deletion-target fields are rejected and no success is returned until every signed or storage-verified target receipt is present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/commands:
    post:
      operationId: dispatchCommand
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/queries:
    post:
      operationId: dispatchQuery
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryEnvelope"
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Purpose:
      name: X-Purpose
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$'
  schemas:
    BatchId:
      type: string
      pattern: '^B(?:0[0-9]|[1-9][0-9]|1[01][0-9]|12[0-7])$'
    Capability:
      type: object
      additionalProperties: false
      required: [batchId, skill, operation, permission, portalId, mode, requirements, requiresExternalEvidence]
      properties:
        batchId:
          $ref: "#/components/schemas/BatchId"
        skill:
          type: string
        operation:
          type: string
        permission:
          type: string
          minLength: 1
          maxLength: 160
        portalId:
          $ref: "#/components/schemas/CapabilityPortalId"
        mode:
          enum: [resource, state-transition, consent-write, ledger-post, partner-settlement-ledger, inbox-event, external-command, attestation]
        requirements:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
        requiresExternalEvidence:
          type: boolean
    CapabilityPortalId:
      enum: [consumer, family, partner, studio, operations, support, developer]
    Role:
      enum: [consumer, household_admin, guardian, partner_employee, partner_admin, studio_operator, support_agent, moderator, privacy_officer, finance_operator, platform_admin, auditor, service_account]
    BrowserOidcConfiguration:
      type: object
      additionalProperties: false
      required: [schemaVersion, issuer, authorizationEndpoint, tokenEndpoint, clientId, redirectUri, scopes, audience]
      properties:
        schemaVersion:
          const: ltm.browser-oidc-config.v1
        issuer:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        authorizationEndpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        tokenEndpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        clientId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,255}$'
        redirectUri:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        scopes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          contains:
            const: openid
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._~:/-]{0,127}$'
        audience:
          type: string
          minLength: 1
          maxLength: 512
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [actorId, tenantId, roles, purpose, stepUp, guardianVerified, authenticationState]
      properties:
        actorId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        purpose:
          type: string
        stepUp:
          type: boolean
        guardianVerified:
          type: boolean
        authenticationState:
          const: server_verified
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required: [session, requestId]
      properties:
        session:
          $ref: "#/components/schemas/AuthenticatedSession"
        requestId:
          type: string
    ConsentPolicyAuthorityResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, catalogId, issuer, environment, catalogSha256, issuedAt, expiresAt, jurisdiction, locale, policyVersions, requestId]
      properties:
        schemaVersion:
          const: ltm.consent-policy-catalog-metadata.v1
        catalogId:
          $ref: "#/components/schemas/Identifier"
        issuer:
          $ref: "#/components/schemas/Identifier"
        environment:
          enum: [development, staging, production]
        catalogSha256:
          $ref: "#/components/schemas/Sha256"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        jurisdiction:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          minLength: 1
          maxLength: 64
        policyVersions:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
        requestId:
          type: string
    ClientSession:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, tenantId, actorId, roles, purpose]
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 8192
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        tenantId:
          $ref: "#/components/schemas/Identifier"
        actorId:
          $ref: "#/components/schemas/Identifier"
        roles:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        purpose:
          type: string
          minLength: 1
          maxLength: 120
    ClientSessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/ClientSession"
    WechatSessionRequest:
      type: object
      additionalProperties: false
      required: [code, consentVersion, clientRequestId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        consentVersion:
          type: string
          minLength: 1
          maxLength: 128
        clientRequestId:
          $ref: "#/components/schemas/Identifier"
    UploadDigest:
      type: object
      additionalProperties: false
      required: [fileDigest, digestAlgorithm]
      properties:
        fileDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        digestAlgorithm:
          const: sha256
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required: [fileDigest, digestAlgorithm, fileSize, contentType, clientRequestId]
      properties:
        fileDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        digestAlgorithm:
          const: sha256
        fileSize:
          type: integer
          minimum: 1
          maximum: 26214400
        contentType:
          const: image/jpeg
        clientRequestId:
          $ref: "#/components/schemas/Identifier"
    UploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, nextOffset, expiresAt]
      properties:
        uploadId:
          type: string
          minLength: 1
          maxLength: 256
        nextOffset:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
    CompletedUpload:
      type: object
      additionalProperties: false
      required: [uploadId, assetId, state]
      properties:
        uploadId:
          type: string
        assetId:
          $ref: "#/components/schemas/Identifier"
        state:
          const: available
    VisibleCapabilityPortal:
      type: object
      additionalProperties: false
      required: [id, skills, capabilityCount]
      properties:
        id:
          $ref: "#/components/schemas/CapabilityPortalId"
        skills:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        capabilityCount:
          type: integer
          minimum: 1
    VisibleCapabilityCatalog:
      type: object
      additionalProperties: false
      required: [schemaVersion, capabilities, portals, count, requestId]
      properties:
        schemaVersion:
          const: ltm.visible-capability-manifest.v1
        capabilities:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/Capability"
        portals:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/VisibleCapabilityPortal"
        count:
          type: integer
          minimum: 0
          maximum: 128
        requestId:
          type: string
    CommandEnvelope:
      oneOf:
        - $ref: "#/components/schemas/ConsentGrantEnvelope"
        - $ref: "#/components/schemas/ParticipantRegisterEnvelope"
        - $ref: "#/components/schemas/ParticipantRevokeEnvelope"
        - $ref: "#/components/schemas/ParticipantAuthorityGrantEnvelope"
        - $ref: "#/components/schemas/ParticipantAuthorityRevokeEnvelope"
        - $ref: "#/components/schemas/ExternalEventApplyEnvelope"
        - $ref: "#/components/schemas/ExternalCommandTransitionEnvelope"
        - $ref: "#/components/schemas/RightsRequestSubmitEnvelope"
        - $ref: "#/components/schemas/RightsTaskReceiptEnvelope"
        - $ref: "#/components/schemas/RightsReviewEnvelope"
        - $ref: "#/components/schemas/RightsEscalateEnvelope"
        - $ref: "#/components/schemas/ShareGrantRevokeEnvelope"
        - $ref: "#/components/schemas/GenericCommandEnvelope"
      discriminator:
        propertyName: command
    QueryEnvelope:
      oneOf:
        - $ref: "#/components/schemas/ConsentRequireEnvelope"
        - $ref: "#/components/schemas/ExternalCommandGetEnvelope"
        - $ref: "#/components/schemas/RightsRequestGetEnvelope"
        - $ref: "#/components/schemas/RightsRequestListEnvelope"
        - $ref: "#/components/schemas/ShareGrantGetEnvelope"
        - $ref: "#/components/schemas/ShareGrantListEnvelope"
        - $ref: "#/components/schemas/GenericQueryEnvelope"
      discriminator:
        propertyName: query
    GenericCommandEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          enum:
            - record.create
            - record.update
            - record.delete
            - consent.withdraw
            - ledger.post
            - inbox.receive
            - evidence.register
            - evidence.revoke
        input:
          type: object
    GenericQueryEnvelope:
      type: object
      additionalProperties: false
      required: [query, input]
      properties:
        query:
          enum:
            - record.get
            - record.list
            - consent.list
            - ledger.get
            - ledger.balance
            - ledger.trialBalance
            - inbox.get
            - outbox.list
            - audit.list
            - audit.verify
            - evidence.get
            - evidence.list
        input:
          type: object
    ConsentScope:
      type: object
      additionalProperties: false
      required: [resource, actions]
      properties:
        resource:
          type: string
          minLength: 3
          maxLength: 256
          pattern: '^[a-z][a-z0-9_.-]{0,63}:[A-Za-z0-9][A-Za-z0-9._:-]{0,191}$'
        actions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z][a-z0-9_.:-]{0,79}$'
    ConsentRequirementScope:
      type: object
      additionalProperties: false
      required: [resource, action]
      properties:
        resource:
          type: string
          minLength: 3
          maxLength: 256
          pattern: '^[a-z][a-z0-9_.-]{0,63}:[A-Za-z0-9][A-Za-z0-9._:-]{0,191}$'
        action:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_.:-]{0,79}$'
    ConsentGrantEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          const: consent.grant
        input:
          type: object
          additionalProperties: false
          required: [participantId, grantorCapacity, purpose, scope, policyVersion]
          properties:
            id:
              $ref: "#/components/schemas/Identifier"
            participantId:
              $ref: "#/components/schemas/Identifier"
            grantorCapacity:
              enum: [self, guardian, authorized_agent]
            purpose:
              type: string
              minLength: 1
              maxLength: 120
            scope:
              $ref: "#/components/schemas/ConsentScope"
            policyVersion:
              $ref: "#/components/schemas/Identifier"
            evidenceHash:
              $ref: "#/components/schemas/Sha256"
            expiresAt:
              oneOf:
                - $ref: "#/components/schemas/CanonicalTimestamp"
                - type: "null"
    ConsentRequireEnvelope:
      type: object
      additionalProperties: false
      required: [query, input]
      properties:
        query:
          const: consent.require
        input:
          type: object
          additionalProperties: false
          required: [participantIds, scope]
          properties:
            participantIds:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Identifier"
            purpose:
              type: string
              minLength: 1
              maxLength: 120
            scope:
              $ref: "#/components/schemas/ConsentRequirementScope"
            at:
              $ref: "#/components/schemas/CanonicalTimestamp"
    ParticipantRegisterEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          const: participant.register
        input:
          type: object
          additionalProperties: false
          required: [participantId, ownerActorId, minorStatus, expiresAt, expectedVersion, evidenceId]
          properties:
            participantId:
              $ref: "#/components/schemas/Identifier"
            ownerActorId:
              $ref: "#/components/schemas/Identifier"
            minorStatus:
              enum: [adult, minor]
            expiresAt:
