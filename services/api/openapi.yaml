      enum: [access, correction, export, withdraw, delete, restrict_processing, appeal]
    RightsRequestProjection:
      type: object
      additionalProperties: false
      required:
        - requestId
        - requestType
        - subjectReference
        - requestedProcessingPurpose
        - status
        - policyVersion
        - submittedAt
        - dueAt
        - overdue
        - completedAt
        - parentRequestId
        - progress
        - tasks
        - review
        - explanationCode
      properties:
        requestId:
          $ref: "#/components/schemas/Identifier"
        requestType:
          $ref: "#/components/schemas/RightsRequestType"
        subjectReference:
          type: string
          pattern: '^subject_[a-f0-9]{16}$'
        requestedProcessingPurpose:
          type: string
          maxLength: 120
        status:
          enum: [propagation_pending, review_pending, awaiting_second_review, escalated, completed, denied]
        policyVersion:
          const: ltm.product-rights-sla.v1
        submittedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        dueAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        overdue:
          type: boolean
        completedAt:
          oneOf:
            - $ref: "#/components/schemas/CanonicalTimestamp"
            - type: "null"
        parentRequestId:
          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        progress:
          type: object
          additionalProperties: false
          required: [total, succeeded, pending, blocked, failed]
          properties:
            total: { type: integer, minimum: 0 }
            succeeded: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        tasks:
          type: array
          maxItems: 20008
          items:
            type: object
            additionalProperties: false
            required: [taskId, target, assetReference, state, attempts]
            properties:
              taskId:
                $ref: "#/components/schemas/Identifier"
              target:
                enum: [primary_record_store, object_storage, cache, derived_artifacts, search_index, processing_queue, log_references, downstream_processors]
              assetReference:
                oneOf:
                  - type: string
                    pattern: '^asset_[a-f0-9]{16}$'
                  - type: "null"
              state:
                enum: [pending, succeeded, blocked, failed]
              attempts:
                type: integer
                minimum: 0
        review:
          type: object
          additionalProperties: false
          required: [approvals, denials, requiredDistinctReviewers]
          properties:
            approvals: { type: integer, minimum: 0, maximum: 2 }
            denials: { type: integer, minimum: 0, maximum: 2 }
            requiredDistinctReviewers: { const: 2 }
        explanationCode:
          enum: [PROPAGATION_PENDING, DEPENDENCY_ATTENTION_REQUIRED, REVIEW_PENDING, SECOND_REVIEW_REQUIRED, COMPLETED, DENIED]
