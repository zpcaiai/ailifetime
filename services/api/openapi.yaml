      properties:
        error:
          type: object
          required: [code, message, retryable, details]
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
        requestId:
          type: string
  responses:
    DispatchResult:
      description: Dispatch result with request correlation metadata.
