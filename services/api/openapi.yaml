        - policySha256
        - classification
        - retentionDays
        - retentionExpiresAt
        - encrypted
        - deletionTargets
        - targetReceipts
      properties:
        mediaReference:
          $ref: "#/components/schemas/Identifier"
        state:
          const: deleted
        auditId:
          $ref: "#/components/schemas/Identifier"
        deletionRequestId:
          $ref: "#/components/schemas/Identifier"
        requestedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        deletedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        policyId:
          $ref: "#/components/schemas/Identifier"
        policySha256:
          $ref: "#/components/schemas/Sha256"
        classification:
          enum: [raw, intermediate, derived, share, print, backup]
        retentionDays:
