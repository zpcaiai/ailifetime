        - tenantId
        - issuer
        - provider
        - environment
        - scope
        - artifactSha256
        - issuedAt
        - expiresAt
        - nonce
        - replayPolicy
        - algorithm
        - keyId
        - signature
      properties:
        version:
          const: ltm.external-evidence.v1
