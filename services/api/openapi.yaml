          oneOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        progress:
          type: object
          additionalProperties: false
          required: [total, succeeded, pending, blocked, failed]
          properties:
            total: { type: integer, minimum: 0 }
            succeeded: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        tasks:
          type: array
          maxItems: 20008
          items:
            type: object
            additionalProperties: false
            required: [taskId, target, assetReference, state, attempts]
            properties:
              taskId:
                $ref: "#/components/schemas/Identifier"
              target:
                enum: [primary_record_store, object_storage, cache, derived_artifacts, search_index, processing_queue, log_references, downstream_processors]
