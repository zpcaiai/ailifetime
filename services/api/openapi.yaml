                oneOf:
                  - type: string
                    pattern: '^asset_[a-f0-9]{16}$'
                  - type: "null"
              state:
                enum: [pending, succeeded, blocked, failed]
              attempts:
                type: integer
                minimum: 0
        review:
          type: object
          additionalProperties: false
          required: [approvals, denials, requiredDistinctReviewers]
          properties:
            approvals: { type: integer, minimum: 0, maximum: 2 }
            denials: { type: integer, minimum: 0, maximum: 2 }
            requiredDistinctReviewers: { const: 2 }
        explanationCode:
          enum: [PROPAGATION_PENDING, DEPENDENCY_ATTENTION_REQUIRED, REVIEW_PENDING, SECOND_REVIEW_REQUIRED, COMPLETED, DENIED]
