        issuer:
          $ref: "#/components/schemas/Identifier"
        provider:
          $ref: "#/components/schemas/Identifier"
        environment:
          enum: [test, sandbox, staging, production]
        scope:
          type: string
          minLength: 1
          maxLength: 512
        artifactSha256:
          $ref: "#/components/schemas/Sha256"
        canonicalClaimsSha256:
          $ref: "#/components/schemas/Sha256"
        businessEventSha256:
          $ref: "#/components/schemas/Sha256"
        issuedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        expiresAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        nonce:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'
        replayPolicy:
          enum: [reusable, single_use]
        algorithm:
          const: Ed25519
        keyId:
