      additionalProperties: false
      required:
        - schemaVersion
        - targetId
        - targetKind
        - deletionRequestId
        - tenantId
        - mediaReference
        - canonicalSha256
        - policySha256
        - state
        - completedAt
        - evidenceSha256
      properties:
        schemaVersion:
          const: ltm.media-deletion-target-receipt.v1
        targetId:
          $ref: "#/components/schemas/Identifier"
        targetKind:
          enum: [s3-object, s3-prefix, https]
        deletionRequestId:
          $ref: "#/components/schemas/Identifier"
        tenantId:
          $ref: "#/components/schemas/Identifier"
        mediaReference:
          $ref: "#/components/schemas/Identifier"
        canonicalSha256:
          $ref: "#/components/schemas/Sha256"
        policySha256:
          $ref: "#/components/schemas/Sha256"
        state:
          const: deleted
        completedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        evidenceSha256:
          $ref: "#/components/schemas/Sha256"
        providerReceiptId:
          $ref: "#/components/schemas/Identifier"
        deletedVersions:
