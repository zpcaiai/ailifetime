      properties:
        assetId:
          $ref: "#/components/schemas/Identifier"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    MediaDeletionTargetReceipt:
      type: object
      description: S3 receipts require deletedVersions, deletedMarkers, and verifiedAbsent=true and forbid providerReceiptId; HTTPS receipts require providerReceiptId and forbid S3 proof fields. Every receipt in one projection binds the same canonical media digest.
      additionalProperties: false
      required:
        - schemaVersion
        - targetId
        - targetKind
        - deletionRequestId
        - tenantId
        - mediaReference
        - canonicalSha256
        - policySha256
        - state
        - completedAt
        - evidenceSha256
      properties:
        schemaVersion:
          const: ltm.media-deletion-target-receipt.v1
        targetId:
          $ref: "#/components/schemas/Identifier"
        targetKind:
          enum: [s3-object, s3-prefix, https]
        deletionRequestId:
          $ref: "#/components/schemas/Identifier"
        tenantId:
          $ref: "#/components/schemas/Identifier"
        mediaReference:
          $ref: "#/components/schemas/Identifier"
        canonicalSha256:
          $ref: "#/components/schemas/Sha256"
        policySha256:
          $ref: "#/components/schemas/Sha256"
        state:
          const: deleted
        completedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        evidenceSha256:
          $ref: "#/components/schemas/Sha256"
        providerReceiptId:
          $ref: "#/components/schemas/Identifier"
        deletedVersions:
          type: integer
          minimum: 0
        deletedMarkers:
          type: integer
          minimum: 0
        verifiedAbsent:
          const: true
    MediaDeletionProjection:
      type: object
      additionalProperties: false
      required:
        - mediaReference
        - state
        - auditId
        - deletionRequestId
        - requestedAt
        - deletedAt
        - policyId
        - policySha256
        - classification
        - retentionDays
        - retentionExpiresAt
        - encrypted
        - deletionTargets
        - targetReceipts
      properties:
        mediaReference:
          $ref: "#/components/schemas/Identifier"
        state:
          const: deleted
        auditId:
          $ref: "#/components/schemas/Identifier"
        deletionRequestId:
          $ref: "#/components/schemas/Identifier"
        requestedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        deletedAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        policyId:
          $ref: "#/components/schemas/Identifier"
        policySha256:
          $ref: "#/components/schemas/Sha256"
        classification:
          enum: [raw, intermediate, derived, share, print, backup]
        retentionDays:
          type: integer
          minimum: 0
          maximum: 36500
        retentionExpiresAt:
          $ref: "#/components/schemas/CanonicalTimestamp"
        encrypted:
          const: true
        deletionTargets:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        targetReceipts:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/MediaDeletionTargetReceipt"
    Health:
