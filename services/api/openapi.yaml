openapi: 3.1.0
info:
  title: AI Life Time Machine Runtime API
  version: 1.0.0
  description: Tenant-safe command, query, and B00-B127 capability dispatch API. The 18 external-command batches resolve to 19 fixed signed callback contracts because B10 has distinct publishExport and revokeExport operations.
servers:
  - url: http://127.0.0.1:8080
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Runtime and audit chain are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: Runtime, audit chain, or evidence trust is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      operationId: getMetrics
      description: Aggregate low-cardinality Prometheus metrics. Production requires a separately configured bearer token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /v1/timelines/{commandId}:
    get:
      operationId: getAgeTimelineDelivery
      description: Owner/purpose/participant-consent checked projection. Generator success alone never publishes an image. Retry children are merged by age; media paths are authenticated API paths, never bearer-bearing URLs.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimelineCommandId"
        - $ref: "#/components/parameters/TimelinePurpose"
      responses:
        "200":
          description: Ordered age nodes with missing and failed ages retained.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineDeliveryResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/timelines/{commandId}/generate:
    post:
      operationId: generateSeedreamTimelineCandidate
      description: Service-account-only Seedream Pro candidate generation. Requires media.generation.generate, an active stored B14 plan, accepted B07 source and current per-person transform consent. One node per awaited request. Model, source, prompt and resolution are server-derived. Durable replay never resubmits an uncertain paid operation. This operation does not certify quality/safety or publish a B14 delivery.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimelineCommandId"
        - $ref: "#/components/parameters/TimelinePurpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetAge]
              properties:
                targetAge: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Private candidate metadata, pending independent quality/safety and signed delivery. No public image URL.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    required: [asset, generatedAt, commandId, targetAge, model, sourceAssetId, sourceSha256, planSha256, promptPolicyVersion, planSeed, seedMode, status, publishable, aiLabel]
                    properties:
                      asset: { $ref: "#/components/schemas/TimelineImageAsset" }
                      generatedAt: { type: string, format: date-time }
                      commandId: { type: string }
                      targetAge: { type: integer, minimum: 0, maximum: 100 }
                      model: { const: doubao-seedream-5-0-pro-260628 }
                      sourceAssetId: { type: string }
                      sourceSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                      planSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                      promptPolicyVersion: { type: string }
                      planSeed: { type: string }
                      seedMode: { const: plan-provenance-only }
                      status: { const: candidate }
                      publishable: { const: false }
                      aiLabel: { type: string }
        default:
          $ref: "#/components/responses/Error"
  /v1/timelines/{commandId}/quality:
    post:
      operationId: evaluateTimelinePhotoQuality
      description: Service-account-only byte-bound photo scoring. Requires media.quality.evaluate and current per-person quality consent. Reads the original B07 reference and output bytes; caller scores, thresholds, model selection and media URLs are forbidden. No generation or publication occurs here. Missing scorer/calibration fails closed; actual model accuracy is independently unaccepted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimelineCommandId"
        - $ref: "#/components/parameters/TimelinePurpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetAge, asset]
              properties:
                targetAge: { type: integer, minimum: 0, maximum: 100 }
                asset: { $ref: "#/components/schemas/TimelineImageAsset" }
      responses:
        "200":
          description: Persisted B15 decision; pass still requires B17 and a signed generation callback before publication.
          content:
            application/json:
              schema:
                type: object
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    additionalProperties: false
                    required: [qualityResultId, decision, failedDimensions, modelVersion, calibrationId, reused]
                    properties:
                      qualityResultId: { type: string }
                      decision: { type: string, enum: [pass, retry, review] }
                      failedDimensions: { type: array, items: { type: string } }
                      modelVersion: { type: string }
                      calibrationId: { type: string }
                      reused: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/timelines/{commandId}/nodes/{targetAge}/wardrobe:
    parameters:
      - $ref: "#/components/parameters/TimelineCommandId"
      - $ref: "#/components/parameters/TimelinePurpose"
      - name: targetAge
        in: path
        required: true
        schema: { type: integer, minimum: 0, maximum: 100 }
    get:
      operationId: getWardrobeContext
      description: Owned, accepted generated age photo only. Returns ordered people, current separate wardrobe consent flags and an age-appropriate closed catalog. This is not model execution.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Context for a separate wardrobe-edit copy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WardrobeContextResponse" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createWardrobeEdit
      description: Creates a B14 wardrobe-edit-v1 request. Source bytes, original/root command, age and people are server-derived; each person must separately grant action wardrobe under wardrobe-edit-consent-v1. Existing age/transform consent alone is insufficient. Caller cannot provide source URLs, arbitrary prompts, quality claims or prices. Original age photo remains unchanged. No model is run by this HTTP handler.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selections]
              properties:
                selections:
                  type: array
                  minItems: 1
                  maxItems: 2
                  uniqueItems: true
                  items:
                    type: object
                    additionalProperties: false
                    required: [participantId, styleId]
                    properties:
                      participantId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
                      styleId: { $ref: "#/components/schemas/WardrobeStyleId" }
      responses:
        "200":
          description: Durable command receipt, not an accepted output. Results, bounded retry and original-byte download use the existing timeline paths with the returned commandId.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    additionalProperties: false
                    required: [commandId, replayed]
                    properties:
                      commandId: { type: string }
                      replayed: { type: boolean }
        default: { $ref: "#/components/responses/Error" }
  /v1/timelines/{commandId}/retry:
    post:
      operationId: retryAgeTimelineNode
      description: Explicit per-age attempt 1..3. Replaying an existing attempt returns its durable command. Active, uncertain, policy-blocked and exhausted nodes cannot start a new attempt. Does not itself execute a model.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimelineCommandId"
        - $ref: "#/components/parameters/TimelinePurpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [targetAge, attempt]
              properties:
                targetAge: { type: integer, minimum: 0, maximum: 100 }
                attempt: { type: integer, minimum: 1, maximum: 3 }
      responses:
        "200":
          description: Durable retry command identity.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, requestId]
                properties:
                  requestId: { type: string }
                  data:
                    type: object
                    additionalProperties: false
                    required: [commandId, attempt, reused]
                    properties:
                      commandId: { type: string }
                      attempt: { type: integer, minimum: 1, maximum: 3 }
                      reused: { type: boolean }
        default:
          $ref: "#/components/responses/Error"
  /v1/timelines/{commandId}/nodes/{targetAge}/image:
    get:
      operationId: downloadAgeTimelineOriginal
      description: Reauthorizes before and after storage read; returns original bytes only for an image bound to accepted quality/safety records. No redirects or remote URL input. Native image quality and storage deployment require independent acceptance.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TimelineCommandId"
        - $ref: "#/components/parameters/TimelinePurpose"
        - name: targetAge
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Original PNG/JPEG, SHA256 and no-store privacy headers.
          headers:
            Cache-Control:
              schema: { const: "private, no-store" }
            X-Ltm-Image-Sha256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
            X-Ltm-Ai-Generated:
              schema: { const: "true" }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/browser/config:
    get:
      operationId: getBrowserOidcConfiguration
      description: Returns the closed, public Authorization Code + PKCE S256 configuration. It contains no client secret, token, trust key, or mutable provider discovery response.
      responses:
        "200":
          description: Deployment-pinned public SPA OIDC configuration.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserOidcConfiguration"
        "503":
          $ref: "#/components/responses/Error"
  /v1/auth/wechat/session:
    post:
      operationId: exchangeWechatLoginCode
      description: Exchanges a single-use wx.login code through the configured HTTPS identity broker; roles and tenant are server-resolved.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatSessionRequest"
      responses:
        "200":
          description: Short-lived in-memory client session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/session/refresh:
    post:
      operationId: refreshClientSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Rotated short-lived session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/auth/session/logout:
    post:
      operationId: revokeClientSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Session revocation accepted by the identity broker.
        default:
          $ref: "#/components/responses/Error"
  /v1/session:
    get:
      operationId: getAuthenticatedSession
      description: Returns only the server-verified principal projection. Bearer credentials are never reflected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Authenticated browser or API session projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/consent-policy/authority:
    get:
      operationId: getConsentPolicyAuthority
      description: Returns only metadata from the server-verified signed consent-policy catalog. Production deployment probes authenticate with workload identity and bind this projection to the release subject.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Active production consent-policy catalog authority metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentPolicyAuthorityResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities/visible:
    get:
      operationId: listVisibleCapabilities
      description: Returns the intersection of the server portal manifest, verified roles, and executable permissions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Server-authorized capability and portal projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisibleCapabilityCatalog"
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities:
    get:
      operationId: listCapabilities
      responses:
        "200":
          description: The exact B00-B127 executable catalog.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities, count, requestId]
                properties:
                  capabilities:
                    type: array
                    minItems: 128
                    maxItems: 128
                    items:
                      $ref: "#/components/schemas/Capability"
                  count:
                    const: 128
                  requestId:
                    type: string
    post:
      operationId: executeCapabilityEnvelope
      description: For B05 the public input is the closed `{assetId, reason}` contract. Classification, retention and deletion targets are resolved only by the broker's signed production policy catalog; success includes the complete per-target receipt set.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, input]
              properties:
                batchId:
                  $ref: "#/components/schemas/BatchId"
                input:
                  type: object
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      operationId: createResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadCreateRequest"
      responses:
        "201":
          description: Durable upload session created by the media broker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/chunks:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: appendResumableUploadChunk
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: Content-Range
          in: header
          required: true
          schema:
            type: string
            pattern: '^bytes (0|[1-9]\d*)-(0|[1-9]\d*)/(0|[1-9]\d*)$'
        - name: X-Chunk-Sha256
          in: header
          required: true
          description: Lowercase SHA-256 of the exact binary request body.
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 5242880
      responses:
        "200":
          description: Chunk durably accepted at the exact offset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [nextOffset]
                properties:
                  nextOffset:
                    type: integer
                    minimum: 1
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: completeResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDigest"
      responses:
        "200":
          description: Media verified and available through its opaque reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedUpload"
        default:
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadId}/cancel:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    post:
      operationId: cancelResumableUpload
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Upload cancellation accepted.
        default:
          $ref: "#/components/responses/Error"
  /v1/capabilities/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/BatchId"
    get:
      operationId: getCapability
      responses:
        "200":
          description: Registered capability metadata.
          content:
            application/json:
              schema:
                type: object
                required: [capability, requestId]
                properties:
                  capability:
                    $ref: "#/components/schemas/Capability"
                  requestId:
                    type: string
        "404":
          $ref: "#/components/responses/Error"
    post:
      operationId: executeCapability
      description: For B05 the public input is the closed `{assetId, reason}` contract. Caller-supplied policy or deletion-target fields are rejected and no success is returned until every signed or storage-verified target receipt is present.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/integrations/evidence-sink/preflight:
    post:
      operationId: preflightEvidenceSinkPermissions
      description: Proves that the same authenticated service principal owns both evidence registration and external-event apply permissions. The operation is read-only and accepts only an empty object.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Both evidence sink permissions are present on this service principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSinkPreflight"
        default:
          $ref: "#/components/responses/Error"
  /v1/mobile/telemetry:
    post:
      operationId: ingestMinimizedNativeMobileTelemetry
      description: Authenticated, server-pseudonymized operational telemetry persisted through B41. Arbitrary fields, identifiers, URLs, credentials, and raw payloads are rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTelemetryEvent"
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/wechat/payments:
    post:
      operationId: createWechatPaymentIntent
      description: Creates a JSAPI payment intent from a trusted server checkout. Client price, currency, payer openid, merchant configuration, notify URL, and provider state are rejected. B71 remains a signed callback-only capability.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatPaymentCreateRequest"
      responses:
        "201":
          description: Server-priced, short-lived WeChat JSAPI payment intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatPaymentIntentResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/wechat/payments/{orderId}:
    get:
      operationId: getWechatPaymentProjection
      description: Returns the merchant-server projection whose terminal state is driven only by the verified WeChat Pay callback and reconciliation path.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - name: orderId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Tenant- and actor-bound payment projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatPaymentProjectionResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/wechat/subscription-offer:
    get:
      operationId: getWechatSubscriptionOffer
      description: Returns only currently enrolled WeChat subscription template IDs. The client cannot add or replace templates.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      responses:
        "200":
          description: Bounded, expiring server-enrolled subscription offer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatSubscriptionOfferResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/wechat/subscription-authorizations:
    post:
      operationId: recordWechatSubscriptionAuthorization
      description: Persists only the subset accepted by wx.requestSubscribeMessage against the exact server offer revision.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatSubscriptionAuthorizationRequest"
      responses:
        "201":
          description: Opaque one-use authorization references durably recorded by the server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatSubscriptionAuthorizationResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/wechat/customer-service-grants:
    post:
      operationId: createWechatCustomerServiceGrant
      description: Creates a short-lived customer-service grant bound to an enrolled HTTPS origin and a server-created minimal ticket context.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "201":
          description: Short-lived WeChat customer-service chat grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WechatCustomerServiceGrantResponse"
        default:
          $ref: "#/components/responses/Error"
  /v1/commands:
    post:
      operationId: dispatchCommand
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandEnvelope"
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
  /v1/queries:
    post:
      operationId: dispatchQuery
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Purpose"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryEnvelope"
      responses:
        "200":
          $ref: "#/components/responses/DispatchResult"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    TimelineCommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
    TimelinePurpose:
      name: X-Purpose
      in: header
      required: true
      schema: { const: age_transformation }
    Purpose:
      name: X-Purpose
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$'
  schemas:
    TimelineImageAsset:
      type: object
      additionalProperties: false
      required: [id, sha256, mimeType, width, height, byteLength]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$' }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        mimeType: { enum: [image/jpeg, image/png] }
        width: { type: integer, minimum: 1, maximum: 8192 }
        height: { type: integer, minimum: 1, maximum: 8192 }
        byteLength: { type: integer, minimum: 1, maximum: 26214400 }
    TimelineResultManifest:
      description: Optional resultManifest on a verified B14 partner callback only. Runtime additionally enforces unique ages/assets/digests, exact source/plan age coverage and per-output quality/safety bindings. No media URL is accepted here.
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceAssetId, planVersion, aiLabel, nodes]
      properties:
        schemaVersion: { const: ltm.timeline-results.v1 }
        sourceAssetId: { type: string }
        planVersion: { type: string }
        aiLabel: { const: true }
        nodes:
          type: array
          minItems: 1
          maxItems: 101
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required: [nodeId, targetAge, status, asset, qualityResultId, safetyResultId]
                properties:
                  nodeId: { type: string }
                  targetAge: { type: integer, minimum: 0, maximum: 100 }
                  status: { const: ready }
                  asset: { $ref: "#/components/schemas/TimelineImageAsset" }
                  qualityResultId: { type: string }
                  safetyResultId: { type: string }
              - type: object
                additionalProperties: false
                required: [nodeId, targetAge, status, errorCode]
                properties:
                  nodeId: { type: string }
                  targetAge: { type: integer, minimum: 0, maximum: 100 }
                  status: { enum: [failed, review] }
                  errorCode: { enum: [PROVIDER_TRANSIENT, QUALITY_REJECTED, POLICY_BLOCKED, CANCELLED] }
    WardrobeStyleId:
      description: Immutable catalog v1 IDs. The three legacy IDs retain their original instructions; new IDs enforce target-age and participant-count eligibility on the server.
      enum: [casual, formal, traditional, east-pankou-v1, east-song-v1, east-qipao-v1, east-hanfu-v1, retro-eighties-v1, retro-hongkong-v1, retro-denim-v1, retro-white-v1, together-knit-v1, together-white-v1, together-trench-v1, together-silver-v1, daily-white-v1, daily-cream-v1, daily-linen-v1, daily-suit-v1, wedding-simple-v1, wedding-vintage-v1, wedding-chinese-v1, wedding-anniversary-v1, milestone-graduation-v1, milestone-career-v1, milestone-birthday-v1, milestone-retirement-v1, winter-wool-v1, winter-scarf-v1, winter-knit-v1, winter-puffer-v1, newyear-chinese-v1, newyear-red-v1, newyear-pair-v1]
    WardrobeContextResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          additionalProperties: false
          required: [sourceAssetId, sourceRootCommandId, sourceCommandId, targetAge, sourceNode, participants, styles, policyVersion, catalogVersion]
          properties:
            sourceAssetId: { type: string }
            sourceRootCommandId: { type: string }
            sourceCommandId: { type: string }
            targetAge: { type: integer, minimum: 0, maximum: 100 }
            policyVersion: { const: wardrobe-edit-consent-v1 }
            catalogVersion: { const: lifetime-wardrobe.v1 }
            sourceNode:
              type: object
              additionalProperties: false
              required: [nodeId, targetAge, status, attempts, canRetry, errorCode, commandId, asset, downloadPath]
              properties:
                nodeId: { type: string }
                targetAge: { type: integer, minimum: 0, maximum: 100 }
                status: { const: ready }
                attempts: { type: integer, minimum: 0, maximum: 3 }
                canRetry: { const: false }
                errorCode: { type: "null" }
                commandId: { type: string }
                asset: { $ref: "#/components/schemas/TimelineImageAsset" }
                downloadPath: { type: [string, "null"] }
            participants:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: object
                additionalProperties: false
                required: [participantId, position, authorized]
                properties:
                  participantId: { type: string }
                  position: { enum: [single, left, right] }
                  authorized: { type: boolean }
            styles:
              type: array
              minItems: 34
              maxItems: 34
              items:
                type: object
                additionalProperties: false
                required: [id, label, seriesId, seriesLabel, minAge, maxAge, minPeople, available, unavailableReason, legacy]
                properties:
                  id: { $ref: "#/components/schemas/WardrobeStyleId" }
                  label: { type: string }
                  seriesId: { enum: [east, retro, together, daily, wedding, milestone, winter, newyear, legacy] }
                  seriesLabel: { type: string }
                  minAge: { type: integer, minimum: 0, maximum: 100 }
                  maxAge: { const: 100 }
                  minPeople: { enum: [1, 2] }
                  available: { type: boolean }
                  unavailableReason: { type: string }
                  legacy: { type: boolean }
    TimelineDeliveryResponse:
      type: object
      additionalProperties: false
      required: [data, requestId]
      properties:
        requestId: { type: string }
        data:
          type: object
          additionalProperties: false
          required: [commandId, sourceAssetId, commandState, creationKind, wardrobeSource, reconciliationState, state, expectedCount, readyCount, missingAges, aiLabel, mediaAvailable, nodes]
          properties:
            commandId: { type: string }
            sourceAssetId: { type: string }
            creationKind: { enum: [age, wardrobe] }
            wardrobeSource:
              oneOf:
                - type: "null"
                - type: object
                  additionalProperties: false
                  required: [sourceRootCommandId, targetAge, selections]
                  properties:
                    sourceRootCommandId: { type: string }
                    targetAge: { type: integer, minimum: 0, maximum: 100 }
                    selections:
                      type: array
                      minItems: 1
                      maxItems: 2
                      items:
                        type: object
                        additionalProperties: false
                        required: [participantId, styleId]
                        properties:
                          participantId: { type: string }
                          styleId: { $ref: "#/components/schemas/WardrobeStyleId" }
            commandState: { enum: [requested, dispatched, acknowledged, succeeded, failed, cancelled, compensated] }
            reconciliationState: { type: string }
            state: { enum: [ready, partial, pending, blocked] }
            expectedCount: { type: integer, minimum: 1, maximum: 101 }
            readyCount: { type: integer, minimum: 0, maximum: 101 }
            missingAges:
              type: array
              uniqueItems: true
              items: { type: integer, minimum: 0, maximum: 100 }
            aiLabel: { type: string }
            mediaAvailable: { type: boolean }
            nodes:
              type: array
              minItems: 1
              maxItems: 101
              items:
                type: object
                additionalProperties: false
                required: [nodeId, targetAge, status, attempts, canRetry, errorCode, commandId, downloadPath]
                properties:
                  nodeId: { type: string }
                  targetAge: { type: integer, minimum: 0, maximum: 100 }
                  status: { enum: [pending, ready, failed, review, retrying, reconciliation_required] }
                  attempts: { type: integer, minimum: 0, maximum: 3 }
                  canRetry: { type: boolean }
                  errorCode: { type: [string, "null"] }
                  commandId: { type: string }
                  downloadPath: { type: [string, "null"], pattern: '^/v1/timelines/[A-Za-z0-9._:-]+/nodes/[0-9]{1,3}/image$' }
                  asset: { $ref: "#/components/schemas/TimelineImageAsset" }
    MobileTelemetryEvent:
      type: object
      additionalProperties: false
      required: [eventId, name, occurredAt, fields]
      properties:
        eventId:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9._:-]{1,127}$'
        occurredAt:
          type: string
          format: date-time
        fields:
          type: object
          minProperties: 1
          maxProperties: 10
          additionalProperties: false
          properties:
            platform: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            appVersion: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            networkType: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            status: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            errorCode: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            durationMs: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            bytes: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            attempt: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            screen: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
            operation: { oneOf: [{ type: string, maxLength: 128 }, { type: number }, { type: boolean }] }
    EvidenceSinkPreflight:
      type: object
      additionalProperties: false
      required: [schemaVersion, principal, permissions, requestId]
      properties:
        schemaVersion:
          const: ltm.evidence-sink-preflight.v1
        principal:
          type: object
          additionalProperties: false
          required: [actorId, tenantId]
          properties:
            actorId:
              type: string
              minLength: 1
              maxLength: 128
            tenantId:
              type: string
              minLength: 1
              maxLength: 128
        permissions:
          type: array
          prefixItems:
            - const: evidence:register
            - const: external-event:apply
          minItems: 2
          maxItems: 2
        requestId:
          type: string
    BatchId:
      type: string
      pattern: '^B(?:0[0-9]|[1-9][0-9]|1[01][0-9]|12[0-7])$'
    Capability:
      type: object
      additionalProperties: false
      required: [batchId, skill, operation, permission, portalId, mode, requirements, requiresExternalEvidence]
      properties:
        batchId:
          $ref: "#/components/schemas/BatchId"
        skill:
          type: string
        operation:
          type: string
        permission:
          type: string
          minLength: 1
          maxLength: 160
        portalId:
          $ref: "#/components/schemas/CapabilityPortalId"
        mode:
          enum: [resource, state-transition, consent-write, ledger-post, partner-settlement-ledger, inbox-event, external-command, attestation]
        requirements:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: string
        requiresExternalEvidence:
          type: boolean
    CapabilityPortalId:
      enum: [consumer, family, partner, studio, operations, support, developer]
    Role:
      enum: [consumer, household_admin, guardian, partner_employee, partner_admin, studio_operator, support_agent, moderator, privacy_officer, finance_operator, platform_admin, auditor, service_account]
    BrowserOidcConfiguration:
      type: object
      additionalProperties: false
      required: [schemaVersion, issuer, authorizationEndpoint, tokenEndpoint, clientId, redirectUri, scopes, audience]
      properties:
        schemaVersion:
          const: ltm.browser-oidc-config.v1
        issuer:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        authorizationEndpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        tokenEndpoint:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        clientId:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~:-]{0,255}$'
        redirectUri:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 1024
        scopes:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          contains:
            const: openid
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._~:/-]{0,127}$'
        audience:
          type: string
          minLength: 1
          maxLength: 512
    AuthenticatedSession:
      type: object
      additionalProperties: false
      required: [actorId, tenantId, roles, purpose, stepUp, guardianVerified, authenticationState]
      properties:
        actorId:
          type: string
        tenantId:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        purpose:
          type: string
        stepUp:
          type: boolean
        guardianVerified:
          type: boolean
        authenticationState:
          const: server_verified
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required: [session, requestId]
      properties:
        session:
          $ref: "#/components/schemas/AuthenticatedSession"
        requestId:
          type: string
    ConsentPolicyAuthorityResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, catalogId, issuer, environment, catalogSha256, issuedAt, expiresAt, jurisdiction, locale, policyVersions, requestId]
      properties:
        schemaVersion:
          const: ltm.consent-policy-catalog-metadata.v1
        catalogId:
          $ref: "#/components/schemas/Identifier"
        issuer:
          $ref: "#/components/schemas/Identifier"
        environment:
          enum: [development, staging, production]
        catalogSha256:
          $ref: "#/components/schemas/Sha256"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        jurisdiction:
          type: string
          minLength: 1
          maxLength: 64
        locale:
          type: string
          minLength: 1
          maxLength: 64
        policyVersions:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
        requestId:
          type: string
    ClientSession:
      type: object
      additionalProperties: false
      required: [accessToken, expiresAt, tenantId, actorId, roles, purpose]
      properties:
        accessToken:
          type: string
          minLength: 20
          maxLength: 8192
          readOnly: true
        expiresAt:
          type: string
          format: date-time
        tenantId:
          $ref: "#/components/schemas/Identifier"
        actorId:
          $ref: "#/components/schemas/Identifier"
        roles:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        purpose:
          type: string
          minLength: 1
          maxLength: 120
    ClientSessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: "#/components/schemas/ClientSession"
    WechatSessionRequest:
      type: object
      additionalProperties: false
      required: [code, consentVersion, clientRequestId]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        consentVersion:
          type: string
          minLength: 1
          maxLength: 128
        clientRequestId:
          $ref: "#/components/schemas/Identifier"
    UploadDigest:
      type: object
      additionalProperties: false
      required: [fileDigest, digestAlgorithm]
      properties:
        fileDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        digestAlgorithm:
          const: sha256
    UploadCreateRequest:
      type: object
      additionalProperties: false
      required: [fileDigest, digestAlgorithm, fileSize, contentType, clientRequestId]
      properties:
        fileDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        digestAlgorithm:
          const: sha256
        fileSize:
          type: integer
          minimum: 1
          maximum: 26214400
        contentType:
          const: image/jpeg
        clientRequestId:
          $ref: "#/components/schemas/Identifier"
    UploadSession:
      type: object
      additionalProperties: false
      required: [uploadId, nextOffset, chunkBytes, expiresAt]
      properties:
        uploadId:
          type: string
          minLength: 1
          maxLength: 256
        nextOffset:
          type: integer
          minimum: 0
        chunkBytes:
          type: integer
          const: 5242880
        expiresAt:
          type: string
          format: date-time
    CompletedUpload:
      type: object
      additionalProperties: false
      required: [uploadId, assetId, state]
      properties:
        uploadId:
          type: string
        assetId:
          $ref: "#/components/schemas/Identifier"
        state:
          const: available
    VisibleCapabilityPortal:
      type: object
      additionalProperties: false
      required: [id, skills, capabilityCount]
      properties:
        id:
          $ref: "#/components/schemas/CapabilityPortalId"
        skills:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        capabilityCount:
          type: integer
          minimum: 1
    VisibleCapabilityCatalog:
      type: object
      additionalProperties: false
      required: [schemaVersion, capabilities, portals, count, requestId]
      properties:
        schemaVersion:
          const: ltm.visible-capability-manifest.v1
        capabilities:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/Capability"
        portals:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/VisibleCapabilityPortal"
        count:
          type: integer
          minimum: 0
          maximum: 128
        requestId:
          type: string
    CommandEnvelope:
      oneOf:
        - $ref: "#/components/schemas/ConsentGrantEnvelope"
        - $ref: "#/components/schemas/ParticipantRegisterEnvelope"
        - $ref: "#/components/schemas/ParticipantRevokeEnvelope"
        - $ref: "#/components/schemas/ParticipantAuthorityGrantEnvelope"
        - $ref: "#/components/schemas/ParticipantAuthorityRevokeEnvelope"
        - $ref: "#/components/schemas/ExternalEventApplyEnvelope"
        - $ref: "#/components/schemas/ExternalCommandTransitionEnvelope"
        - $ref: "#/components/schemas/RightsRequestSubmitEnvelope"
        - $ref: "#/components/schemas/RightsTaskReceiptEnvelope"
        - $ref: "#/components/schemas/RightsReviewEnvelope"
        - $ref: "#/components/schemas/RightsEscalateEnvelope"
        - $ref: "#/components/schemas/ShareGrantRevokeEnvelope"
        - $ref: "#/components/schemas/GenericCommandEnvelope"
      discriminator:
        propertyName: command
    QueryEnvelope:
      oneOf:
        - $ref: "#/components/schemas/ConsentRequireEnvelope"
        - $ref: "#/components/schemas/ExternalCommandGetEnvelope"
        - $ref: "#/components/schemas/RightsRequestGetEnvelope"
        - $ref: "#/components/schemas/RightsRequestListEnvelope"
        - $ref: "#/components/schemas/ShareGrantGetEnvelope"
        - $ref: "#/components/schemas/ShareGrantListEnvelope"
        - $ref: "#/components/schemas/GenericQueryEnvelope"
      discriminator:
        propertyName: query
    GenericCommandEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          enum:
            - record.create
            - record.update
            - record.delete
            - consent.withdraw
            - ledger.post
            - inbox.receive
            - evidence.register
            - evidence.revoke
        input:
          type: object
    GenericQueryEnvelope:
      type: object
      additionalProperties: false
      required: [query, input]
      properties:
        query:
          enum:
            - record.get
            - record.list
            - consent.list
            - ledger.get
            - ledger.balance
            - ledger.trialBalance
            - inbox.get
            - outbox.list
            - audit.list
            - audit.verify
            - evidence.get
            - evidence.list
        input:
          type: object
    ConsentScope:
      type: object
      additionalProperties: false
      required: [resource, actions]
      properties:
        resource:
          type: string
          minLength: 3
          maxLength: 256
          pattern: '^[a-z][a-z0-9_.-]{0,63}:[A-Za-z0-9][A-Za-z0-9._:-]{0,191}$'
        actions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
            pattern: '^[a-z][a-z0-9_.:-]{0,79}$'
    ConsentRequirementScope:
      type: object
      additionalProperties: false
      required: [resource, action]
      properties:
        resource:
          type: string
          minLength: 3
          maxLength: 256
          pattern: '^[a-z][a-z0-9_.-]{0,63}:[A-Za-z0-9][A-Za-z0-9._:-]{0,191}$'
        action:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^[a-z][a-z0-9_.:-]{0,79}$'
    ConsentGrantEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          const: consent.grant
        input:
          type: object
          additionalProperties: false
          required: [participantId, grantorCapacity, purpose, scope, policyVersion]
          properties:
            id:
              $ref: "#/components/schemas/Identifier"
            participantId:
              $ref: "#/components/schemas/Identifier"
            grantorCapacity:
              enum: [self, guardian, authorized_agent]
            purpose:
              type: string
              minLength: 1
              maxLength: 120
            scope:
              $ref: "#/components/schemas/ConsentScope"
            policyVersion:
              $ref: "#/components/schemas/Identifier"
            evidenceHash:
              $ref: "#/components/schemas/Sha256"
            expiresAt:
              oneOf:
                - $ref: "#/components/schemas/CanonicalTimestamp"
                - type: "null"
    ConsentRequireEnvelope:
      type: object
      additionalProperties: false
      required: [query, input]
      properties:
        query:
          const: consent.require
        input:
          type: object
          additionalProperties: false
          required: [participantIds, scope]
          properties:
            participantIds:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: "#/components/schemas/Identifier"
            purpose:
              type: string
              minLength: 1
              maxLength: 120
            scope:
              $ref: "#/components/schemas/ConsentRequirementScope"
            at:
              $ref: "#/components/schemas/CanonicalTimestamp"
    ParticipantRegisterEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          const: participant.register
        input:
          type: object
          additionalProperties: false
          required: [participantId, ownerActorId, minorStatus, expiresAt, expectedVersion, evidenceId]
          properties:
            participantId:
              $ref: "#/components/schemas/Identifier"
            ownerActorId:
              $ref: "#/components/schemas/Identifier"
            minorStatus:
              enum: [adult, minor]
            expiresAt:
              $ref: "#/components/schemas/CanonicalTimestamp"
            expectedVersion:
              oneOf:
                - type: integer
                  minimum: 1
                - type: "null"
            evidenceId:
              $ref: "#/components/schemas/Identifier"
    ParticipantRevokeEnvelope:
      type: object
      additionalProperties: false
      required: [command, input]
      properties:
        command:
          const: participant.revoke
        input:
          type: object
          additionalProperties: false
          required: [participantId, expectedVersion, reason, evidenceId]
          properties:
            participantId:
              $ref: "#/components/schemas/Identifier"
            expectedVersion:
