        artifactSha256:
          $ref: "#/components/schemas/Sha256"
        evidenceId:
          $ref: "#/components/schemas/Identifier"
        evidenceScope:
          type: string
          minLength: 1
          maxLength: 512
        canonicalClaims:
          type: object
          minProperties: 1
